<style>

  overflow-wrap: break-word;
}
body, table, td, a {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
}

  mso-table-lspace: 0pt;
  mso-table-rspace: 0pt;
}

  -ms-interpolation-mode: bicubic;
  border: 0;
  outline: none;
  text-decoration: none;
}
body {
  margin: 0 !important;
  padding: 0 !important;
  background-color: #f1f5f9;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;

@media only screen and (max-width: 600px) {
  .email-wrap { padding: 12px 10px !important; }

<body style="margin:0;padding:0;background-color:#f1f5f9;">

<!-- Email wrapper -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0"
  style="width:100%;max-width:100vw;background-color:#f1f5f9;">
<tr>
<td class="email-wrap" style="padding:24px 16px;">

  <!-- Container -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"
    style="width:100%;max-width:640px;margin:0 auto;">

    <!-- ── Header ─────────────────────────────────────────────────────────── -->
    <tr>
      <td class="header-wrap" style="background:#1e293b;border-radius:10px 10px 0 0;
                 padding:28px 32px 24px;text-align:left;">
        <p style="font-size:11px;font-weight:600;letter-spacing:.2em;
                  text-transform:uppercase;color:#38bdf8;margin:0 0 8px;">
          ideal.song Dashboard · Daily Digest
        </p>
        <h1 style="font-size:28px;font-weight:800;line-height:1.15;
                   color:#f8fafc;margin:0 0 6px;letter-spacing:-.02em;">
          The <span style="color:#38bdf8;">Signal</span> Report
        </h1>
        <p style="font-size:12px;color:#94a3b8;margin:0;">2026-07-28</p>
        <p style="font-size:11px;color:#64748b;margin:4px 0 0;">Data: <span style="color:#94a3b8;">2026-07-27</span> &nbsp;·&nbsp; Crawled: <span style="color:#94a3b8;">2026-07-28 00:11 KST</span></p>
      </td>
    </tr>

    <!-- ── Stats bar ───────────────────────────────────────────────────────── -->
    <tr>
      <td class="stats-wrap" style="background:#0f172a;padding:16px 32px;border-bottom:1px solid #1e293b;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"
          style="width:100%;">
          <tr>
            <td style="text-align:center;padding:0 16px;"><div style="font-size:26px;font-weight:700;color:#38bdf8;line-height:1;letter-spacing:-.02em;">0</div><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:#94a3b8;margin-top:3px;">Articles</div></td>
            <td style="width:1px;background:#334155;padding:0;"></td>
            <td style="text-align:center;padding:0 16px;"><div style="font-size:26px;font-weight:700;color:#34d399;line-height:1;letter-spacing:-.02em;">0</div><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:#94a3b8;margin-top:3px;">Fetched</div></td>
            <td style="width:1px;background:#334155;padding:0;"></td>
            <td style="text-align:center;padding:0 16px;"><div style="font-size:26px;font-weight:700;color:#f87171;line-height:1;letter-spacing:-.02em;">0</div><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:#94a3b8;margin-top:3px;">Failed</div></td>
            <td style="width:1px;background:#334155;padding:0;"></td>
            <td style="text-align:center;padding:0 16px;"><div style="font-size:26px;font-weight:700;color:#a78bfa;line-height:1;letter-spacing:-.02em;">0</div><div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:#94a3b8;margin-top:3px;">Requested</div></td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- ── Type summary ────────────────────────────────────────────────────── -->
    <tr>
      <td style="background:#ffffff;padding:14px 32px;
                 border-bottom:1px solid #e2e8f0;">
        <div style="font-size:11px;font-weight:600;color:#94a3b8;
                    text-transform:uppercase;letter-spacing:.12em;
                    margin-bottom:8px;">Content types</div>
        <div><span class="type-filter active" data-filter="all" style="display:inline-block;margin:2px 4px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;cursor:pointer;background:#0f172a;color:#f8fafc;border:1px solid #334155;">All 0</span></div>
      </td>
    </tr>

    <!-- ── Articles ────────────────────────────────────────────────────────── -->
    <tr>
      <td class="content-wrap" style="background:#f8fafc;padding:20px 24px 8px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"
          style="width:100%;">
          
          
          <tr><td style="padding:32px;text-align:center;color:#94a3b8;font-size:14px;">No articles matched the current filters.</td></tr>
        </table>
      </td>
    </tr>

    <!-- ── Filter JS ──────────────────────────────────────────────────────── -->
<script>
(function(){
  var filters = document.querySelectorAll('.type-filter');
  filters.forEach(function(btn){
    btn.addEventListener('click', function(){
      filters.forEach(function(b){ b.classList.remove('active'); b.style.opacity='0.55'; });
      this.classList.add('active'); this.style.opacity='1';
      var f = this.dataset.filter;
      document.querySelectorAll('.article-card').forEach(function(row){
        row.style.display = (f === 'all' || row.dataset.type === f) ? '' : 'none';
      });
    });
  });
  // init: all visible, All chip full opacity
  filters.forEach(function(b){ b.style.opacity = b.dataset.filter==='all' ? '1' : '0.55'; });
})();
</script>

    <!-- ── Footer ─────────────────────────────────────────────────────────── -->
    <tr>
      <td style="background:#f1f5f9;border-radius:0 0 10px 10px;
                 padding:20px 32px;border-top:1px solid #e2e8f0;">
        <p style="font-size:11px;color:#94a3b8;line-height:1.7;margin:0;">
          이 요약은 보고서 파일에 수집된 본문만을 기반으로 작성되었습니다. 외부 사이트 접속 및 AI 생성 내용은 포함되지 않았습니다.
        </p>
      </td>
    </tr>

  </table>
  <!-- /Container -->

</td>
</tr>
</table>
<!-- /Email wrapper -->

</html>
